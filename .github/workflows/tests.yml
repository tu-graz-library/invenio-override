name: CI

on:
  pull_request:
    branches: main
  push:
    branches: main
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron: "0 3 * * 6"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason"
        required: false
        default: "Manual trigger"

jobs:
  python_tests:
    uses: tu-graz-library/.github/.github/workflows/tests.yml@main

  djlint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install djlint
        run: pip install "djlint~=1.36.4"
      - name: Check HTML templates
        run: djlint --check invenio_override/templates/
